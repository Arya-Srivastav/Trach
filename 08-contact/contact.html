<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trach - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav>
        <div class="logo">Trach</div>
        <div class="nav-links">
            <a href="../01-home/index.html">Home</a>
            <a href="../02-about/about.html">About</a>
            <a href="../03-how-it-works/how-it-works.html">How It Works</a>
            <a href="../04-questionnaire/questionnaire.html">Questionnaire</a>
            <a href="../06-matches/matches.html">Matches</a>
        </div>
    </nav>
</header>

<main class="container">
    <p class="eyebrow">CONTACT</p>
    <h1>Talk to the Trach team</h1>
    <p class="lead">
        This is a simple frontend example of a contact page.
    </p>

    <div class="contact-card">
        <div class="contact-info">
            <h2>Have an idea?</h2>
            <p>
                A real version could use this page for questions, feedback,
                or support.
            </p>
        </div>

        <div class="form-side">
            <div class="question">
                <label>Your name</label>
                <input type="text" placeholder="Enter your name">
            </div>

            <div class="question">
                <label>Your message</label>
                <textarea placeholder="Enter your message"></textarea>
            </div>

            <a class="button" href="../01-home/index.html">Back to Home</a>
        </div>
    </div>
</main>

<footer>
    <p>Trach &bull; Contact</p>
</footer>
</body>
</html>
